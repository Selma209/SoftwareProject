<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Create your BankEase account</title>
</h:head>

<h:body>
    <h1>Create an account</h1>

    <h:form>
        <h:outputLabel for="user" value="Username:" /><br/>
        <h:inputText id="user" value="#{createClientBean.username}" /><br/><br/>

        <h:outputLabel for="first" value="First name:" /><br/>
        <h:inputText id="first" value="#{createClientBean.firstName}" /><br/><br/>

        <h:outputLabel for="last" value="Last name:" /><br/>
        <h:inputText id="last" value="#{createClientBean.lastName}" /><br/><br/>

        <h:outputLabel for="mail" value="Email:" /><br/>
        <h:inputText id="mail" value="#{createClientBean.email}" /><br/><br/>

        <h:commandButton value="Create my account" action="#{createClientBean.register}" />
    </h:form>

    <br/>
    <h:link value="Back to login" outcome="index" />
</h:body>

</html>
